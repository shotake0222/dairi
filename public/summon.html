<!-- OGP（SNS・メッセージアプリでURLを共有したときのカード表示）。
     og:image / og:url の絶対URL化は、配信ドメインが変わっても正しく動くよう

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0b12; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .stage { position: relative; width: 100%; max-width: 480px; aspect-ratio: 3/4; overflow: hidden; border-radius: 16px; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  model-viewer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    --poster-color: transparent; background-color: transparent;
    opacity: 0; transform: scale(0.8) translateY(10px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  model-viewer.show { opacity: 1; transform: scale(1) translateY(0); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding: 24px; gap: 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0) 40%);
    text-align: center; pointer-events: none;
  }
  .overlay > * { pointer-events: auto; }
  .appear {
    font-size: 22px; font-weight: 700; opacity: 0; transform: translateY(12px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .appear.show { opacity: 1; transform: translateY(0); }
  .hint { font-size: 13px; opacity: 0.7; }
  button {
    padding: 12px 28px; border-radius: 999px; border: none; font-size: 16px; font-weight: 600;
    background: #fff; color: #111; opacity: 0; transition: opacity 0.6s ease; cursor: pointer;
  }
  button.show { opacity: 1; }
  button:disabled { opacity: 0.4 !important; cursor: default; }
  /* カメラが使えないときの案内。
     以前は画面全体に絶対配置していたため、登場テキストや説明文とちょうど重なり、
     どちらも読めなくなっていた。**重ねずに、他の文と同じ流れに置く**。
     カメラ前提の説明文（.hint）のほうは、カメラが無い時点で嘘になるのでJS側で隠す。 */
  .fallback { color: #b9b3cc; font-size: 13px; line-height: 1.8; text-align: center; }
  .brand { position: absolute; top: 16px; left: 16px; font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); font-weight: 700; z-index: 2; }
  /* 行き止まりにしないための出口。タップ領域が小さいと押せないので、余白ごと確保する。 */
  #homeLink {
    position: absolute; top: 12px; right: 46px; z-index: 2;
    font-size: 11px; color: rgba(255,255,255,0.72); text-decoration: none;
    padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.3); white-space: nowrap;
  }
  #infoBtn {
    position: absolute; top: 12px; right: 12px; z-index: 2; width: 26px; height: 26px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: #fff; font-weight: 700;
    font-size: 13px; cursor: pointer; line-height: 1;
  }

  /* コンセプトを最初に伝える2行のテキスト（初回タップ時のみ表示） */
  /* 限定の姿の一言を2行目に出すことがあるので、改行をそのまま効かせる */
  .conceptText { opacity: 0; transform: translateY(10px); transition: opacity 0.9s ease, transform 0.9s ease;
                 white-space: pre-line; }
  .conceptText.show { opacity: 1; transform: translateY(0); }
  .conceptText .line1 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .conceptText .line1 b { color: #c9b8ff; }
  .conceptText .line2 { font-size: 12px; opacity: 0.75; }

  #conceptModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 5;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #conceptModal[hidden] { display: none; }
  #conceptModal .box { background: #17131f; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; max-width: 340px; color: #fff; }
  #conceptModal h3 { margin: 0 0 10px; font-size: 15px; color: #c9b8ff; }
  #conceptModal p { margin: 0 0 14px; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.85); }
  #conceptModal button { width: 100%; padding: 10px; border-radius: 999px; border: none; background: #7c5cff; color: #fff; font-weight: 600; }

  .nameForm {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%; max-width: 320px; opacity: 0; transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease; pointer-events: none;
  }
  .nameForm.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .nameForm input {
    width: 100%; padding: 12px 16px; border-radius: 999px; border: none;
    font-size: 16px; text-align: center; background: rgba(255,255,255,0.92); color: #111;
  }
  .nameForm button { opacity: 1; }

  #goTalk {
    font-size: 12px; color: #c9b8ff; text-decoration: none; padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(201,184,255,0.4); background: rgba(0,0,0,0.25);
    opacity: 0; transition: opacity 0.6s ease;
  }
  #goTalk.show { opacity: 1; }

  /* ロゴ（勾玉）。形の由来と作図は public/icons/mark.svg のコメントを参照。
     読み込みを1往復増やさないため、pathはHTMLに直接埋め込んでいる。 */
  .brand { display: inline-flex; align-items: center; gap: 5px; }
  .brand .mk { width: 1.25em; height: 1.25em; flex: none; }
</style>
</head>

  <div class="stage">
    <div class="brand"><svg class="mk" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M59.7 13.8 C61.1 14.9 65.5 17.8 68.1 20.4 C70.6 22.9 73.1 26.0 74.9 29.0 C76.6 32.1 77.8 35.3 78.5 38.7 C79.1 42.1 79.3 45.9 78.7 49.4 C78.0 52.9 76.7 56.7 74.8 59.7 C72.9 62.7 70.3 65.4 67.4 67.3 C64.5 69.2 60.8 70.7 57.5 71.1 C54.1 71.5 50.2 71.2 47.1 69.9 C44.0 68.6 40.1 64.6 38.7 63.5 A5.0 5.0 0 0 1 45.1 55.8 C45.6 56.1 46.9 57.1 48.0 57.4 C49.0 57.7 50.2 57.8 51.2 57.6 C52.3 57.4 53.5 56.9 54.4 56.3 C55.3 55.7 56.0 54.8 56.5 53.8 C57.0 52.9 57.3 51.7 57.3 50.6 C57.3 49.6 57.0 48.3 56.5 47.4 C56.0 46.5 55.0 45.5 54.1 45.2 C53.2 44.9 51.7 45.6 51.2 45.7 A16.5 16.5 0 0 1 59.7 13.8 Z M47.5 29.7a7.9 7.9 0 1 0 15.8 0a7.9 7.9 0 1 0 -15.8 0Z"/></svg><span>わけたま</span></div>
    <a id="homeLink" href="/home" title="分身の一覧へ">← 分身の一覧</a>
    <button id="infoBtn" type="button" title="わけたまとは？">?</button>
    <video id="cam" autoplay playsinline muted></video>
    <!-- 3Dモデル表示。カメラ映像の上に浮かべることで簡易的なAR風の登場演出にしている。
         ar-modes を有効にしているため、対応端末では「ARで見る」から実カメラ越しのAR表示にも遷移できる。 -->
    <model-viewer id="model" camera-controls disable-zoom auto-rotate auto-rotate-delay="0"
      rotation-per-second="18deg" interaction-prompt="none"
      shadow-intensity="0" exposure="1.1" ar ar-modes="webxr scene-viewer quick-look">
    </model-viewer>
    <div class="overlay">
      <div class="appear" id="appearText">…</div>

      <!-- 初回タップ時だけ表示する、サービスの本質を1秒で伝えるための2行テキスト -->
      <div class="conceptText" id="conceptText">
        <div class="line1">この子は、<b>あなたの分身</b>になる存在</div>
        <div class="line2">会話を重ねるほど、いつかメタバースやロボットの姿にもなっていく</div>
      </div>

      <div class="hint" id="hint">キーホルダーを画面に映すと、キャラクターが姿を見せてくれます</div>
      <div class="fallback" id="fallback" hidden>
        カメラを起動できませんでした。<br />このままキャラクターに会うこともできます。
      </div>

      <!-- 初回タップ時だけ表示する命名フォーム -->
      <form class="nameForm" id="nameForm">
        <input id="nameInput" type="text" maxlength="12" placeholder="名前をつけてあげよう" autocomplete="off" />
        <button type="submit">この名前で出会う</button>
      </form>

      <!-- 2回目以降はこちらのボタンだけ表示 -->
      <button id="goChat">会話をはじめる</button>
      <!-- カメラが既に映っているこの流れのまま声で話せることを、ここで伝える -->
      <a id="goTalk" href="#">📷 このまま かざして話す</a>
    </div>
  </div>

  <div id="conceptModal" hidden>
    <div class="box">
      <h3>わけたまって？</h3>
      <p>
        「わけたま」は、会話を通じてあなただけの分身を育てるサービスです。<br /><br />
        性格はあなたとの会話によって、少しずつ変わっていきます。今はまだ画面の中だけの存在ですが、
        将来はメタバースのアバターや、ロボットのようなフィジカルAIの姿になって、あなたの代わりに動き出す日を目指しています。
      </p>
      <button id="conceptModalClose" type="button">とじる</button>
    </div>
  </div>

<script>
/**
 * 依代をかざしたのに、**どの1枚かを特定できなかった**ときの受け皿（?claim=tag|qr）。
 *
 * 起きるのは、共通URLを書き込んだタグでUIDミラーが効いていないとき
 * （設定漏れ、対応していないチップ、URLを手で短くした、など）。
 * サーバーからは全部同じURLに見えるので、1枚ずつの区別が付かない。
 *
 * **それでも、かざした人の前で「何も起きない」にはしない。**
 * こちらの設定の都合が、そのまま出会いの失敗になるのは筋が悪い。
 * この端末に1体を割り当てて、2回目からは同じ子に戻す。
 *
 * 割り切っていること: **この端末では、依代を何枚持っていても1体**になる。
 * 2枚目を育てたい人は /add から作る。1枚1体を成立させたいなら、
 * タグ側でUIDミラーを設定すること（docs/OPERATIONS.md §5-0）。
 *
 * 下の本体スクリプトは cid がある前提なので、ここで引き取ったら動かさない。
 * 例外で止めると「JSエラーが出ていない」という約束を破るので、旗で伝える。
 */
(function () {
  const params = new URLSearchParams(location.search);
  const claimKind = params.get("claim");
  if (!claimKind || params.get("cid")) return;

  window.__waketamaClaiming = true;
  const CLAIM_KEY = "sodatsukake_tagClaim";

  function fail(text) {
    const el = document.getElementById("appearText");
    if (!el) return;
    el.textContent = text;
    el.classList.add("show");
    const hint = document.getElementById("hint");
    if (hint) hint.textContent = "";
  }

  (async function () {
    let known = "";
    try { known = localStorage.getItem(CLAIM_KEY) || ""; } catch (e) { /* 使えなければ都度つくる */ }

    if (known) {
      // もうこの端末の子が居る。消されていないかだけ確かめて、居れば会いに行く
      try {
        const res = await fetch("/api/character?cid=" + encodeURIComponent(known));
        if (res.ok) {
          location.replace("/chat?cid=" + encodeURIComponent(known));
          return;
        }
      } catch (e) { /* 繋がらないときは下で作り直さず、やり直してもらう */ }
    }

    let res;
    try {
      res = await fetch("/api/character/new?from=" + (claimKind === "qr" ? "qr" : "tag"), { method: "POST" });
    } catch (e) {
      fail("うまく呼び出せませんでした。もう一度かざしてみてください");
      return;
    }
    if (!res.ok) {
      fail(res.status === 429
        ? "今日はもう作れません。明日またかざしてみてください"
        : "うまく呼び出せませんでした。もう一度かざしてみてください");
      return;
    }
    const data = await res.json();
    try { localStorage.setItem(CLAIM_KEY, data.characterId); } catch (e) { /* 覚えられなくても続く */ }
    // ここから先は、ふつうの誕生とまったく同じ流れに乗せる
    location.replace(
      "/summon?cid=" + encodeURIComponent(data.characterId) +
      "&first=1&token=" + encodeURIComponent(data.ownerToken)
    );
  })();
})();
</script>
<script src="/gate.js"></script>
<script>
  // NOTE: 特許ファミリー（撮像画像の表示中にサーバー主導の処理結果を出力する、という共通要件）を
  // 踏まえ、召喚シーンでは「カメラ映像を表示している最中に」キャラクターの登場演出を重畳表示する
  // 構成を維持。演出そのものは、テキストのみ→3Dモデル（model-viewer）表示に強化した。
  // model-viewer の ar 属性により、対応端末では「ARで見る」から実カメラ越しのAR表示にも遷移できる。

  const params = new URLSearchParams(location.search);
  const cid = params.get("cid");
  const isFirst = params.get("first") === "1";
  const tokenParam = params.get("token");
  // どこで配られた依代から来たか（分かるときだけ付く）。見せるためだけの値。
  const spotCode = params.get("spot");
  let spotInfo = null;

  // 「持ち主トークン」: 誕生の瞬間だけURLに乗ってくるので、すぐlocalStorageへ保存してURLからは消しておく。
  // これ以降このブラウザが、名前変更・エクスポート/インポート・オプトインなど持ち主専用の操作を行える。
  if (cid && tokenParam) {
    try {
      localStorage.setItem(`sodatsukake_token_${cid}`, tokenParam);
    } catch (err) {
      /* localStorageが使えなくても召喚自体は続行する（持ち主保護機能だけ効かなくなる） */
    }
    params.delete("token");
    history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
  }

  function getOwnerToken() {
    if (!cid) return "";
    try {
      return localStorage.getItem(`sodatsukake_token_${cid}`) || "";
    } catch (err) {
      return "";
    }
  }

  const appearText = document.getElementById("appearText");
  const conceptText = document.getElementById("conceptText");
  const hint = document.getElementById("hint");
  const goChatBtn = document.getElementById("goChat");
  const nameForm = document.getElementById("nameForm");
  const nameInput = document.getElementById("nameInput");
  const modelEl = document.getElementById("model");
  const infoBtn = document.getElementById("infoBtn");
  const conceptModal = document.getElementById("conceptModal");
  const conceptModalClose = document.getElementById("conceptModalClose");
  const goTalkLink = document.getElementById("goTalk");
  goTalkLink.href = `/talk?cid=${encodeURIComponent(cid || "")}`;

  infoBtn.addEventListener("click", () => (conceptModal.hidden = false));
  conceptModalClose.addEventListener("click", () => (conceptModal.hidden = true));

  // 上の受け皿が引き取っている最中は、こちらは何も言わない（一瞬だけ
  // 「見つかりませんでした」が見えて、すぐ画面が飛ぶ、という見え方になるため）
  if (!cid && !window.__waketamaClaiming) {
    appearText.textContent = "キャラクターが見つかりませんでした";
  }

  /**
   * どこで手に入れた子なのかを引く。
   *
   * 姿は依代の種類によらずランダムなので、「その場所の子」であることは見た目では分からない。
   * だから言葉で一度だけ伝える。ここが無いと、特別な場所で配る意味が利用者に届かない。
   */
  async function loadSpot() {
    if (!spotCode) return;
    try {
      const res = await fetch(`/api/spot?code=${encodeURIComponent(spotCode)}`);
      if (!res.ok) return;
      const data = await res.json();
      spotInfo = data.spot || null;
    } catch (e) {
      /* 出会いの本筋ではないので、取れなければ黙って出さない */
    }
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      document.getElementById("cam").srcObject = stream;
    } catch (e) {
      document.getElementById("fallback").hidden = false;
      // カメラ前提の案内は、カメラが無い時点で嘘になるうえ、上の案内と重なって読めなくなる
      document.getElementById("hint").hidden = true;
    }
  }

  async function loadCharacter() {
    if (!cid) return null;
    const res = await fetch(`/api/character?cid=${encodeURIComponent(cid)}`);
    if (!res.ok) return null;
    return res.json();
  }

  function applyModel(data) {
    if (!data || !data.species || !data.color) return;
    modelEl.src = `/characters/${data.species}_${data.color}.glb`;
    modelEl.setAttribute("alt", data.name || "キャラクター");
  }

  function goToChat() {
    location.href = `/chat?cid=${encodeURIComponent(cid || "")}`;
  }

  (async () => {
    if (window.__waketamaClaiming) return;
    startCamera();
    // 生まれた直後、名前を付けるより先に同意を取る。
    // ここを飛ばすと、規約を読んでいない人が会話画面まで進んでしまう。
    if (cid && window.waketamaGate) {
      const agreed = await window.waketamaGate.require(cid, getOwnerToken());
      if (!agreed) {
        appearText.textContent = "同意がないため、ここから先へは進めません";
        appearText.classList.add("show");
        hint.textContent = "";
        return;
      }
    }
    if (spotCode) loadSpot();
    const data = await loadCharacter();
    applyModel(data);

    if (isFirst) {
      // 初回: たまごが光るような演出→3Dモデル登場→名前を決めてもらう
      setTimeout(() => {
        appearText.textContent = "……なにかが生まれる気配がする";
        appearText.classList.add("show");
      }, 500);

      setTimeout(() => {
        modelEl.classList.add("show");
      }, 900);

      // サービスの本質（=自分の分身であること、将来複数の身体に宿ること）を、
      // 名前を付ける前のこのタイミングで一度だけ、短い言葉で伝える。
      setTimeout(() => {
        conceptText.classList.add("show");
      }, 1700);

      setTimeout(() => {
        hint.textContent = "この子に、名前をつけてあげよう";
        // その場所でしか会えない子なら、どこで会ったのかをここで伝える。
        // 見た目が決まっているのはそのためだと分かると、集める意味がはっきりする。
        if (spotInfo) {
          const where = spotInfo.note
            ? `${spotInfo.label}　—　${spotInfo.note}`
            : `${spotInfo.label}　で手に入れた子です`;
          // 限定の姿がある場所なら、それも伝える。
          // **何が出るかは先に言わない**（サーバー側も返していない）。
          // 引いたあとで「ここでしか会えない姿だった」と分かるほうが、手に入れた実感が残る。
          conceptText.textContent = spotInfo.limited
            ? `${where}\nここでしか出会えない姿です`
            : where;
        }
        nameForm.classList.add("show");
        nameInput.focus();
      }, 3400);

      nameForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name || !cid) return;

        const submitBtn = nameForm.querySelector("button");
        submitBtn.disabled = true;
        nameInput.disabled = true;

        try {
          await fetch("/api/character/rename", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ characterId: cid, name, token: getOwnerToken() }),
          });
        } catch (err) {
          // 命名APIが失敗しても会話自体は続けられるようにする
        }

        appearText.textContent = `「${name}」が生まれた……！`;
        nameForm.classList.remove("show");
        hint.textContent = "";
        setTimeout(goToChat, 900);
      });
    } else {
      // 2回目以降: 既存の名前・姿でお出迎え
      const name = data?.name || "きみの相棒";
      modelEl.classList.add("show");
      setTimeout(() => {
        appearText.textContent = `「${name}」がきみを見つけたよ`;
        appearText.classList.add("show");
      }, 400);
      setTimeout(() => {
        goChatBtn.classList.add("show");
        goTalkLink.classList.add("show");
      }, 1100);
      goChatBtn.addEventListener("click", goToChat);
    }
  })();
</script>

<script>
  // Service Workerの登録。失敗してもアプリ本体の動作には一切影響させない
  // （非対応ブラウザ・プライベートモード・http環境などでは単に登録されないだけ）。
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
