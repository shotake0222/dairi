<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>わけみたま｜キャラクター召喚</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0b12; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .stage { position: relative; width: 100%; max-width: 480px; aspect-ratio: 3/4; overflow: hidden; border-radius: 16px; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  model-viewer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    --poster-color: transparent; background-color: transparent;
    opacity: 0; transform: scale(0.8) translateY(10px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  model-viewer.show { opacity: 1; transform: scale(1) translateY(0); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding: 24px; gap: 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0) 40%);
    text-align: center; pointer-events: none;
  }
  .overlay > * { pointer-events: auto; }
  .appear {
    font-size: 22px; font-weight: 700; opacity: 0; transform: translateY(12px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .appear.show { opacity: 1; transform: translateY(0); }
  .hint { font-size: 13px; opacity: 0.7; }
  button {
    padding: 12px 28px; border-radius: 999px; border: none; font-size: 16px; font-weight: 600;
    background: #fff; color: #111; opacity: 0; transition: opacity 0.6s ease; cursor: pointer;
  }
  button.show { opacity: 1; }
  button:disabled { opacity: 0.4 !important; cursor: default; }
  .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; padding: 24px; text-align: center; }
  .brand { position: absolute; top: 16px; left: 16px; font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); font-weight: 700; z-index: 2; }
  #infoBtn {
    position: absolute; top: 12px; right: 12px; z-index: 2; width: 26px; height: 26px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: #fff; font-weight: 700;
    font-size: 13px; cursor: pointer; line-height: 1;
  }

  /* コンセプトを最初に伝える2行のテキスト（初回タップ時のみ表示） */
  .conceptText { opacity: 0; transform: translateY(10px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .conceptText.show { opacity: 1; transform: translateY(0); }
  .conceptText .line1 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .conceptText .line1 b { color: #c9b8ff; }
  .conceptText .line2 { font-size: 12px; opacity: 0.75; }

  #conceptModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 5;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #conceptModal[hidden] { display: none; }
  #conceptModal .box { background: #17131f; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; max-width: 340px; color: #fff; }
  #conceptModal h3 { margin: 0 0 10px; font-size: 15px; color: #c9b8ff; }
  #conceptModal p { margin: 0 0 14px; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.85); }
  #conceptModal button { width: 100%; padding: 10px; border-radius: 999px; border: none; background: #7c5cff; color: #fff; font-weight: 600; }

  .nameForm {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%; max-width: 320px; opacity: 0; transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease; pointer-events: none;
  }
  .nameForm.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .nameForm input {
    width: 100%; padding: 12px 16px; border-radius: 999px; border: none;
    font-size: 16px; text-align: center; background: rgba(255,255,255,0.92); color: #111;
  }
  .nameForm button { opacity: 1; }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">わけみたま</div>
    <button id="infoBtn" type="button" title="わけみたまとは？">?</button>
    <video id="cam" autoplay playsinline muted></video>
    <div class="fallback" id="fallback" hidden>
      カメラを起動できませんでした。<br />このままキャラクターに会うこともできます。
    </div>
    <!-- 3Dモデル表示。カメラ映像の上に浮かべることで簡易的なAR風の登場演出にしている。
         ar-modes を有効にしているため、対応端末では「ARで見る」から実カメラ越しのAR表示にも遷移できる。 -->
    <model-viewer id="model" camera-controls disable-zoom auto-rotate auto-rotate-delay="0"
      rotation-per-second="18deg" interaction-prompt="none"
      shadow-intensity="0" exposure="1.1" ar ar-modes="webxr scene-viewer quick-look">
    </model-viewer>
    <div class="overlay">
      <div class="appear" id="appearText">…</div>

      <!-- 初回タップ時だけ表示する、サービスの本質を1秒で伝えるための2行テキスト -->
      <div class="conceptText" id="conceptText">
        <div class="line1">この子は、<b>あなたの分身</b>になる存在</div>
        <div class="line2">会話を重ねるほど、いつかメタバースやロボットの姿にもなっていく</div>
      </div>

      <div class="hint" id="hint">キーホルダーを画面に映すと、キャラクターが姿を見せてくれます</div>

      <!-- 初回タップ時だけ表示する命名フォーム -->
      <form class="nameForm" id="nameForm">
        <input id="nameInput" type="text" maxlength="12" placeholder="名前をつけてあげよう" autocomplete="off" />
        <button type="submit">この名前で出会う</button>
      </form>

      <!-- 2回目以降はこちらのボタンだけ表示 -->
      <button id="goChat">会話をはじめる</button>
    </div>
  </div>

  <div id="conceptModal" hidden>
    <div class="box">
      <h3>わけみたまって？</h3>
      <p>
        「わけみたま」は、会話を通じてあなただけの分身を育てるサービスです。<br /><br />
        性格はあなたとの会話によって、少しずつ変わっていきます。今はまだ画面の中だけの存在ですが、
        将来はメタバースのアバターや、ロボットのようなフィジカルAIの姿になって、あなたの代わりに動き出す日を目指しています。
      </p>
      <button id="conceptModalClose" type="button">とじる</button>
    </div>
  </div>

<script>
  // NOTE: 特許ファミリー（撮像画像の表示中にサーバー主導の処理結果を出力する、という共通要件）を
  // 踏まえ、召喚シーンでは「カメラ映像を表示している最中に」キャラクターの登場演出を重畳表示する
  // 構成を維持。演出そのものは、テキストのみ→3Dモデル（model-viewer）表示に強化した。
  // model-viewer の ar 属性により、対応端末では「ARで見る」から実カメラ越しのAR表示にも遷移できる。

  const params = new URLSearchParams(location.search);
  const cid = params.get("cid");
  const isFirst = params.get("first") === "1";
  const tokenParam = params.get("token");

  // 「持ち主トークン」: 誕生の瞬間だけURLに乗ってくるので、すぐlocalStorageへ保存してURLからは消しておく。
  // これ以降このブラウザが、名前変更・エクスポート/インポート・オプトインなど持ち主専用の操作を行える。
  if (cid && tokenParam) {
    try {
      localStorage.setItem(`sodatsukake_token_${cid}`, tokenParam);
    } catch (err) {
      /* localStorageが使えなくても召喚自体は続行する（持ち主保護機能だけ効かなくなる） */
    }
    params.delete("token");
    history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
  }

  function getOwnerToken() {
    if (!cid) return "";
    try {
      return localStorage.getItem(`sodatsukake_token_${cid}`) || "";
    } catch (err) {
      return "";
    }
  }

  const appearText = document.getElementById("appearText");
  const conceptText = document.getElementById("conceptText");
  const hint = document.getElementById("hint");
  const goChatBtn = document.getElementById("goChat");
  const nameForm = document.getElementById("nameForm");
  const nameInput = document.getElementById("nameInput");
  const modelEl = document.getElementById("model");
  const infoBtn = document.getElementById("infoBtn");
  const conceptModal = document.getElementById("conceptModal");
  const conceptModalClose = document.getElementById("conceptModalClose");

  infoBtn.addEventListener("click", () => (conceptModal.hidden = false));
  conceptModalClose.addEventListener("click", () => (conceptModal.hidden = true));

  if (!cid) {
    appearText.textContent = "キャラクターが見つかりませんでした";
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      document.getElementById("cam").srcObject = stream;
    } catch (e) {
      document.getElementById("fallback").hidden = false;
    }
  }

  async function loadCharacter() {
    if (!cid) return null;
    const res = await fetch(`/api/character?cid=${encodeURIComponent(cid)}`);
    if (!res.ok) return null;
    return res.json();
  }

  function applyModel(data) {
    if (!data || !data.species || !data.color) return;
    modelEl.src = `/characters/${data.species}_${data.color}.glb`;
    modelEl.setAttribute("alt", data.name || "キャラクター");
  }

  function goToChat() {
    location.href = `/chat.html?cid=${encodeURIComponent(cid || "")}`;
  }

  (async () => {
    startCamera();
    const data = await loadCharacter();
    applyModel(data);

    if (isFirst) {
      // 初回: たまごが光るような演出→3Dモデル登場→名前を決めてもらう
      setTimeout(() => {
        appearText.textContent = "……なにかが生まれる気配がする";
        appearText.classList.add("show");
      }, 500);

      setTimeout(() => {
        modelEl.classList.add("show");
      }, 900);

      // サービスの本質（=自分の分身であること、将来複数の身体に宿ること）を、
      // 名前を付ける前のこのタイミングで一度だけ、短い言葉で伝える。
      setTimeout(() => {
        conceptText.classList.add("show");
      }, 1700);

      setTimeout(() => {
        hint.textContent = "この子に、名前をつけてあげよう";
        nameForm.classList.add("show");
        nameInput.focus();
      }, 3400);

      nameForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name || !cid) return;

        const submitBtn = nameForm.querySelector("button");
        submitBtn.disabled = true;
        nameInput.disabled = true;

        try {
          await fetch("/api/character/rename", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ characterId: cid, name, token: getOwnerToken() }),
          });
        } catch (err) {
          // 命名APIが失敗しても会話自体は続けられるようにする
        }

        appearText.textContent = `「${name}」が生まれた……！`;
        nameForm.classList.remove("show");
        hint.textContent = "";
        setTimeout(goToChat, 900);
      });
    } else {
      // 2回目以降: 既存の名前・姿でお出迎え
      const name = data?.name || "きみの相棒";
      modelEl.classList.add("show");
      setTimeout(() => {
        appearText.textContent = `「${name}」がきみを見つけたよ`;
        appearText.classList.add("show");
      }, 400);
      setTimeout(() => goChatBtn.classList.add("show"), 1100);
      goChatBtn.addEventListener("click", goToChat);
    }
  })();
</script>
</body>
</html>
