<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>そだつかけ｜キャラクターと会話</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f5f3ff; color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #eee; }
  header .row { display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 16px; }
  .brand { font-size: 10px; letter-spacing: 0.08em; color: #a78bfa; font-weight: 700; margin-bottom: 2px; }
  #status { font-size: 12px; color: #666; margin-top: 4px; }
  .nameCol { flex: 1; min-width: 0; }
  .headerActions { display: flex; gap: 6px; align-self: flex-start; flex-shrink: 0; }
  #toggleTraits, #historyLink, #infoBtn {
    border: 1px solid #ddd; background: #fff; color: #7c5cff; font-size: 12px;
    padding: 6px 10px; border-radius: 999px; white-space: nowrap; text-decoration: none;
  }
  #infoBtn { padding: 6px 10px; font-weight: 700; }

  /* コンセプトを最初に伝えるバナー（初回のみ表示・閉じたら二度と出さない） */
  #conceptBanner {
    margin: 10px 16px 0; padding: 12px 14px; border-radius: 12px;
    background: #f0ecff; color: #4c3a99; font-size: 12px; line-height: 1.7;
    display: flex; gap: 10px; align-items: flex-start;
  }
  #conceptBanner .text { flex: 1; }
  #conceptBanner .link { color: #7c5cff; font-weight: 700; text-decoration: underline; cursor: pointer; }
  #conceptBanner .close { border: none; background: none; color: #9a8fcf; font-size: 16px; cursor: pointer; line-height: 1; padding: 0; }

  /* コンセプト説明モーダル */
  #conceptModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #conceptModal[hidden] { display: none; }
  #conceptModal .box { background: #fff; border-radius: 16px; padding: 20px; max-width: 360px; }
  #conceptModal h3 { margin: 0 0 10px; font-size: 15px; color: #4c3a99; }
  #conceptModal p { margin: 0 0 14px; font-size: 13px; line-height: 1.8; color: #444; }
  #conceptModal button { width: 100%; padding: 10px; border-radius: 999px; border: none; background: #7c5cff; color: #fff; font-weight: 600; }

  /* いつでも見れる2Dアバター（常時表示のアイコン） */
  #avatarIcon {
    width: 44px; height: 44px; border-radius: 999px; background: #f0ecff;
    border: 2px solid #e4defc; object-fit: cover; flex-shrink: 0;
  }

  /* チャットしながら見られる3Dモデルパネル */
  #modelStage {
    position: relative; width: 100%; height: 190px;
    background: linear-gradient(180deg, #efeaff, #f5f3ff);
    border-bottom: 1px solid #eee; overflow: hidden; flex-shrink: 0;
  }
  #modelStage model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  #modelToggle {
    position: absolute; top: 8px; right: 8px; border: 1px solid #ddd; background: rgba(255,255,255,0.9);
    color: #7c5cff; font-size: 11px; padding: 4px 10px; border-radius: 999px;
  }
  #modelStage.collapsed { height: 0; border-bottom: none; }
  #modelStage.collapsed model-viewer { visibility: hidden; }

  #traits { display: none; margin: 10px 16px 0; flex-direction: column; gap: 6px; }
  #traits.show { display: flex; }
  .traitRow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #444; }
  .traitLabel { width: 60px; flex-shrink: 0; }
  .traitBarBg { flex: 1; height: 6px; border-radius: 999px; background: #eee; overflow: hidden; }
  .traitBarFg { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #a78bfa, #7c5cff); transition: width 0.4s ease; }
  .traitValue { width: 28px; text-align: right; flex-shrink: 0; color: #888; }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #7c5cff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.char { align-self: flex-start; background: #fff; border: 1px solid #eee; border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: #999; font-size: 12px; border: none; padding: 4px 10px; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #eee; }
  input { flex: 1; padding: 12px 14px; border-radius: 999px; border: 1px solid #ddd; font-size: 14px; }
  button.send { padding: 12px 20px; border-radius: 999px; border: none; background: #7c5cff; color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<header>
  <div class="row">
    <img id="avatarIcon" src="" alt="" hidden />
    <div class="nameCol">
      <div class="brand">そだつかけ</div>
      <h1 id="charName">キャラクター</h1>
      <div id="status">読み込み中…</div>
    </div>
    <div class="headerActions">
      <button id="infoBtn" type="button" title="そだつかけとは？">?</button>
      <a id="historyLink" href="#">📈 成長</a>
      <button id="toggleTraits" type="button">性格を見る ▾</button>
    </div>
  </div>
  <div id="traits">
    <div class="traitRow" data-trait="warmth"><span class="traitLabel">温かさ</span><div class="traitBarBg"><div class="traitBarFg"></div></div><span class="traitValue">-</span></div>
    <div class="traitRow" data-trait="curiosity"><span class="traitLabel">好奇心</span><div class="traitBarBg"><div class="traitBarFg"></div></div><span class="traitValue">-</span></div>
    <div class="traitRow" data-trait="cheerfulness"><span class="traitLabel">陽気さ</span><div class="traitBarBg"><div class="traitBarFg"></div></div><span class="traitValue">-</span></div>
    <div class="traitRow" data-trait="caution"><span class="traitLabel">慎重さ</span><div class="traitBarBg"><div class="traitBarFg"></div></div><span class="traitValue">-</span></div>
    <div class="traitRow" data-trait="independence"><span class="traitLabel">自立心</span><div class="traitBarBg"><div class="traitBarFg"></div></div><span class="traitValue">-</span></div>
    <div class="traitRow" data-trait="humor"><span class="traitLabel">ユーモア</span><div class="traitBarBg"><div class="traitBarFg"></div></div><span class="traitValue">-</span></div>
  </div>
</header>

<!-- 会話しながら見られる3Dモデル表示エリア -->
<div id="modelStage">
  <button id="modelToggle" type="button">たたむ ▴</button>
  <model-viewer id="model" camera-controls disable-zoom auto-rotate auto-rotate-delay="1500"
    rotation-per-second="12deg" interaction-prompt="none" shadow-intensity="0" exposure="1.1"
    ar ar-modes="webxr scene-viewer quick-look">
  </model-viewer>
</div>

<div id="conceptBanner" hidden>
  <div class="text">
    🌱 ここはあなたの<strong>分身</strong>を育てる場所。会話が、そのままこの子の個性になっていきます。
    <span class="link" id="conceptMoreLink">くわしく見る</span>
  </div>
  <button class="close" id="conceptBannerClose" aria-label="閉じる">×</button>
</div>

<div id="log"></div>
<form id="form">
  <input id="input" type="text" placeholder="話しかけてみよう" autocomplete="off" maxlength="400" />
  <button class="send" type="submit">送信</button>
</form>

<div id="conceptModal" hidden>
  <div class="box">
    <h3>そだつかけって？</h3>
    <p>
      「そだつかけ」は、会話を通じてあなただけの分身を育てるサービスです。<br /><br />
      性格はあなたとの会話によって、少しずつ変わっていきます。今はまだ画面の中だけの存在ですが、
      将来はメタバースのアバターや、ロボットのようなフィジカルAIの姿になって、あなたの代わりに動き出す日を目指しています。<br /><br />
      これまでの性格の変化は「📈 成長」から、いつでも振り返れます。
    </p>
    <button id="conceptModalClose" type="button">とじる</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const cid = params.get("cid");
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const statusEl = document.getElementById("status");
  const nameEl = document.getElementById("charName");
  const traitsEl = document.getElementById("traits");
  const toggleTraitsBtn = document.getElementById("toggleTraits");
  const avatarIcon = document.getElementById("avatarIcon");
  const modelEl = document.getElementById("model");
  const modelStage = document.getElementById("modelStage");
  const modelToggle = document.getElementById("modelToggle");
  const historyLink = document.getElementById("historyLink");
  const conceptBanner = document.getElementById("conceptBanner");
  const conceptBannerClose = document.getElementById("conceptBannerClose");
  const conceptMoreLink = document.getElementById("conceptMoreLink");
  const conceptModal = document.getElementById("conceptModal");
  const infoBtn = document.getElementById("infoBtn");
  const conceptModalClose = document.getElementById("conceptModalClose");

  historyLink.href = `/history.html?cid=${encodeURIComponent(cid || "")}`;

  // コンセプト（=あなたの分身を育てるサービスである、ということ）を、
  // 初めてこのページを開いたときにだけさりげなく伝えるバナー。閉じたら二度と出さない。
  const CONCEPT_SEEN_KEY = "sodatsukake_conceptSeen";
  try {
    if (!localStorage.getItem(CONCEPT_SEEN_KEY)) {
      conceptBanner.hidden = false;
    }
  } catch (e) {
    // localStorageが使えない環境でもチャット自体は問題なく動くようにする
  }

  function dismissConceptBanner() {
    conceptBanner.hidden = true;
    try {
      localStorage.setItem(CONCEPT_SEEN_KEY, "1");
    } catch (e) {}
  }

  conceptBannerClose.addEventListener("click", dismissConceptBanner);
  conceptMoreLink.addEventListener("click", () => {
    conceptModal.hidden = false;
    dismissConceptBanner();
  });
  infoBtn.addEventListener("click", () => (conceptModal.hidden = false));
  conceptModalClose.addEventListener("click", () => (conceptModal.hidden = true));

  toggleTraitsBtn.addEventListener("click", () => {
    const nowShown = traitsEl.classList.toggle("show");
    toggleTraitsBtn.textContent = nowShown ? "性格を見る ▴" : "性格を見る ▾";
  });

  modelToggle.addEventListener("click", () => {
    const collapsed = modelStage.classList.toggle("collapsed");
    modelToggle.textContent = collapsed ? "3Dを見る ▾" : "たたむ ▴";
  });

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = `msg ${who}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  // いつでも見れる2Dアイコン＋3Dモデルの両方を、種族・色に応じて設定する
  function applyCharacterVisuals(data) {
    if (!data || !data.species || !data.color) return;
    const base = `/characters/${data.species}_${data.color}`;
    avatarIcon.src = `${base}.png`;
    avatarIcon.alt = data.name || "キャラクター";
    avatarIcon.hidden = false;
    modelEl.src = `${base}.glb`;
    modelEl.setAttribute("alt", data.name || "キャラクター");
  }

  function renderStatus(data) {
    nameEl.textContent = data.name || "キャラクター";
    const styleLabel = data.speechStyleLabel ? ` / 口調: ${data.speechStyleLabel}` : "";
    statusEl.textContent = `成長段階: ${data.growthStage} / やり取り回数: ${data.interactionCount ?? 0}${styleLabel}`;
    if (data.personality) renderPersonality(data.personality);
    applyCharacterVisuals(data);
  }

  function renderPersonality(personality) {
    for (const row of traitsEl.querySelectorAll(".traitRow")) {
      const key = row.dataset.trait;
      const value = Math.round(personality[key] ?? 50);
      row.querySelector(".traitBarFg").style.width = `${value}%`;
      row.querySelector(".traitValue").textContent = value;
    }
  }

  async function loadInitial() {
    if (!cid) {
      statusEl.textContent = "キャラクターIDが指定されていません";
      return;
    }
    const res = await fetch(`/api/character?cid=${encodeURIComponent(cid)}`);
    if (res.ok) {
      const data = await res.json();
      renderStatus(data);
      if (!data.interactionCount) {
        addMessage("……はじめまして。よろしくね。", "char");
      }
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message || !cid) return;
    addMessage(message, "user");
    input.value = "";
    input.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ characterId: cid, message }),
      });
      const data = await res.json();
      if (data.error) {
        addMessage(data.error, "system");
      } else if (data.reply) {
        addMessage(data.reply, "char");
      }
      renderStatus(data);
    } catch (err) {
      addMessage("（うまく通信できなかったみたい……もう一度送ってみて）", "char");
    } finally {
      input.disabled = false;
      input.focus();
    }
  });

  loadInitial();
</script>
</body>
</html>
