<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>わけたま｜オフラインです</title>
<meta name="theme-color" content="#7c5cff" />
<link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png" />
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; background: #f5f3ff; color: #4c3a99;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 14px;
  }
  img { width: 96px; height: 96px; opacity: 0.9; }
  h1 { font-size: 17px; margin: 0; }
  p { font-size: 13px; line-height: 1.9; color: #6b5cae; margin: 0; max-width: 320px; }
  button {
    margin-top: 8px; padding: 10px 22px; border: none; border-radius: 999px;
    background: #7c5cff; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="" />
  <h1>いまはオフラインみたい</h1>
  <p>
    分身とのやり取りにはインターネット接続が必要です。<br />
    電波のいい場所で、もう一度ひらいてみてね。
  </p>
  <button type="button" id="reloadBtn">再読み込み</button>
  <script>
    document.getElementById("reloadBtn").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
