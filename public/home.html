<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>そだつかけ｜分身一覧</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f5f3ff; color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  header { padding: 16px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 2; }
  .brand { font-size: 10px; letter-spacing: 0.08em; color: #a78bfa; font-weight: 700; margin-bottom: 2px; }
  header h1 { margin: 0; font-size: 17px; }
  header .sub { font-size: 12px; color: #999; margin-top: 4px; }

  main { padding: 16px; max-width: 560px; margin: 0 auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .entry {
    position: relative; background: #fff; border: 1px solid #eee; border-radius: 16px; padding: 12px;
    text-decoration: none; color: inherit; display: block; transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .entry:hover { box-shadow: 0 4px 14px rgba(124,92,255,0.14); transform: translateY(-1px); }
  .entry .icon {
    width: 100%; aspect-ratio: 1; border-radius: 12px; background: #f5f3ff;
    display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 8px;
  }
  .entry .icon img { width: 80%; height: 80%; object-fit: contain; }
  .entry .ename { font-size: 14px; font-weight: 700; color: #333; }
  .entry .estage { font-size: 11px; color: #a78bfa; margin-top: 2px; }
  .entry .evisit { font-size: 10px; color: #aaa; margin-top: 4px; }
  .entry .removeBtn {
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 999px;
    border: 1px solid #eee; background: #fff; color: #bbb; font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .entry .removeBtn:hover { color: #dc2626; border-color: #f3caca; }

  .card {
    background: #fff; border-radius: 16px; padding: 18px 16px; margin-bottom: 16px; border: 1px solid #eee;
  }
  .card h2 { margin: 0 0 8px; font-size: 14px; color: #444; }
  .concept {
    font-size: 12px; color: #7c5cff; background: #f0ecff; border-radius: 12px;
    padding: 12px 14px; line-height: 1.7;
  }

  .empty { text-align: center; color: #888; font-size: 13px; padding: 50px 20px; line-height: 1.8; }
  .empty .big { font-size: 32px; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">そだつかけ</div>
  <h1>あなたの分身たち</h1>
  <div class="sub">この端末でこれまでに開いたことのある分身の一覧です</div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="emptyState" hidden class="empty">
    <div class="big">🌱</div>
    NFCタグにタップすると、ここに分身が並んでいきます。<br />
    まずは分身に会いに行ってみましょう。
  </div>

  <div class="card" id="conceptCard" hidden>
    <div class="concept">
      それぞれの分身は、そのNFCタグ・その端末で育ってきた「もう一人のあなた」です。この一覧はアカウント登録なしで、
      この端末のブラウザだけが覚えている記録なので、別の端末で開くとここには表示されません（分身自体のデータは
      Cloudflare側にちゃんと保存されています）。
    </div>
  </div>
</main>

<script>
  const MY_CHARACTERS_KEY = "sodatsukake_myCharacters";
  const SPECIES_LABELS = {
    punikoro: "ぷにころ",
    mofukuru: "もふくる",
    tsunomaru: "つのまる",
    howahowa: "ほわほわ",
    kiratsubu: "きらつぶ",
  };

  function loadList() {
    try {
      const raw = localStorage.getItem(MY_CHARACTERS_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function saveList(list) {
    try {
      localStorage.setItem(MY_CHARACTERS_KEY, JSON.stringify(list));
    } catch (e) {
      /* 保存できなくても致命的ではない */
    }
  }

  function formatVisit(ms) {
    if (!ms) return "";
    const diffHours = (Date.now() - ms) / (1000 * 60 * 60);
    if (diffHours < 1) return "たった今";
    if (diffHours < 24) return `${Math.round(diffHours)}時間前`;
    const days = Math.round(diffHours / 24);
    return `${days}日前`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function cardHtml(c) {
    const speciesLabel = SPECIES_LABELS[c.species] || c.species || "";
    const iconSrc = c.species && c.color ? `/characters/${c.species}_${c.color}.png` : "";
    return `
      <div class="icon">${iconSrc ? `<img src="${iconSrc}" alt="${escapeHtml(c.name || "")}" />` : ""}</div>
      <div class="ename">${escapeHtml(c.name || "名もなき分身")}</div>
      <div class="estage">${escapeHtml(c.growthStage || speciesLabel)}</div>
      <div class="evisit">${formatVisit(c.lastVisit)}</div>
    `;
  }

  function render() {
    const list = loadList();
    const grid = document.getElementById("grid");
    const emptyState = document.getElementById("emptyState");
    const conceptCard = document.getElementById("conceptCard");
    grid.innerHTML = "";

    if (list.length === 0) {
      emptyState.hidden = false;
      conceptCard.hidden = true;
      return;
    }
    emptyState.hidden = true;
    conceptCard.hidden = false;

    for (const c of list) {
      const a = document.createElement("a");
      a.className = "entry";
      a.href = `/chat.html?cid=${encodeURIComponent(c.cid)}`;
      a.innerHTML = cardHtml(c);

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "removeBtn";
      removeBtn.setAttribute("aria-label", "一覧から外す");
      removeBtn.textContent = "×";
      removeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const ok = confirm(`「${c.name || "この分身"}」をこの一覧から外しますか？（分身自体のデータは消えません）`);
        if (!ok) return;
        const next = loadList().filter((item) => item.cid !== c.cid);
        saveList(next);
        render();
      });
      a.appendChild(removeBtn);

      grid.appendChild(a);
    }

    // 表示は即座にキャッシュ済みデータで行い、裏側で最新の名前・成長段階に静かに更新しておく
    refreshInBackground(list);
  }

  // キャッシュ済みの表示をすぐ出したあと、裏側で最新の名前・成長段階を取りに行って静かに更新する。
  // 実際に値が変わった時だけ再描画・再保存する（変わっていないのに毎回render()すると無限ループになるため）。
  async function refreshInBackground(list) {
    let changed = false;
    const latest = loadList();
    for (const c of list) {
      try {
        const res = await fetch(`/api/character?cid=${encodeURIComponent(c.cid)}`);
        if (!res.ok) continue;
        const data = await res.json();
        const idx = latest.findIndex((item) => item.cid === c.cid);
        if (idx === -1) continue;
        const before = latest[idx];
        const after = {
          ...before,
          name: data.name || before.name,
          species: data.species || before.species,
          color: data.color || before.color,
          growthStage: data.growthStage || before.growthStage,
          interactionCount: data.interactionCount,
        };
        if (
          after.name !== before.name ||
          after.species !== before.species ||
          after.color !== before.color ||
          after.growthStage !== before.growthStage ||
          after.interactionCount !== before.interactionCount
        ) {
          latest[idx] = after;
          changed = true;
        }
      } catch (e) {
        /* 1体分の更新に失敗しても他は続ける */
      }
    }
    if (changed) {
      saveList(latest);
      render();
    }
  }

  render();
</script>
</body>
</html>
