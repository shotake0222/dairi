<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="わけたま" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    勾玉（まがたま）。サービス名の由来「分け御霊」を、玉そのもので表している。

    作図は3つの円だけで決まる。大きい円 B（半径R=17）の右半分に、頭になる円（半径11）を足し、
    尾になる円（半径6）を引く。11 + 6 = 17 なので3つの円が同じ縦線上で接し、
    頭から尾へ滑らかに細くなる。最後に頭へ紐を通す穴を開ける。
    アイコン・OGPも同じ作図で生成している（tools/make_brand_assets.py の magatama_mask）。

    HTMLにはこの path を直接埋め込んでいる（読み込みを1往復増やさないため）。
    形を変えるときは、この2箇所と make_brand_assets.py の3つを必ず揃えること。
  -->
  <path fill="#7c5cff" fill-rule="evenodd"
        d="M24 7 A17 17 0 0 1 24 41 A6 6 0 0 0 24 29 A11 11 0 0 1 24 7 Z
           M28.6 18 A4.6 4.6 0 1 1 19.4 18 A4.6 4.6 0 1 1 28.6 18 Z" />
</svg>
