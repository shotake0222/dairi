<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="わけたま" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    勾玉（まがたま）。サービス名の由来「分け御霊」を、玉そのもので表している。

    形の作り方（tools/make_brand_assets.py の magatama_outline と同じ手順）:
      背骨になる「らせん」を1本引く。中心 (50,50)、半径21から始めて、尾に向かって
      半径を40%縮めながら205度まわす。その背骨に、頭で33・尾で10の太さを持たせ、
      両端を半円で閉じる。最後に頭へ紐を通す穴を開ける。
      らせんにしてあるのが肝で、ただの円弧だと内側の縁に段差（食い違い）が出る。

    HTMLにはこの path を直接埋め込んでいる（読み込みを1往復増やさないため）。
    形を変えるときは、このファイル・各HTMLのpath・make_brand_assets.py の3つを必ず揃えること。
  -->
