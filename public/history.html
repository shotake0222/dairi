<!-- OGP（SNS・メッセージアプリでURLを共有したときのカード表示）。
     og:image / og:url の絶対URL化は、配信ドメインが変わっても正しく動くよう
     src/index.ts の HTMLRewriter がリクエスト元のオリジンを見て書き換える。 -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="わけたま" />
<meta property="og:title" content="わけたま｜成長の記録" />
<meta property="og:description" content="会話を重ねるほど変わっていく、分身の性格の移り変わりをグラフで振り返る。" />
<meta property="og:image" content="/icons/ogp.png" />
<meta property="og:url" content="/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="わけたま｜成長の記録" />
<meta name="twitter:description" content="会話を重ねるほど変わっていく、分身の性格の移り変わりをグラフで振り返る。" />
<meta name="twitter:image" content="/icons/ogp.png" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f5f3ff; color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  header { padding: 14px 16px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 2; }
  header .row { display: flex; align-items: center; gap: 10px; }
  .brand { font-size: 10px; letter-spacing: 0.08em; color: #a78bfa; font-weight: 700; margin-bottom: 2px; }
  header h1 { margin: 0; font-size: 16px; }
  #backBtn {
    border: 1px solid #ddd; background: #fff; color: #7c5cff; font-size: 13px;
    padding: 8px 12px; border-radius: 999px; white-space: nowrap; text-decoration: none;
  }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #eee; }
  .card h2 { margin: 0 0 4px; font-size: 14px; color: #444; }
  .card .sub { font-size: 12px; color: #999; margin-bottom: 12px; }
  #chartWrap { position: relative; width: 100%; }
  canvas { width: 100%; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 12px; }
  .legendItem { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }

  .deltaList { display: flex; flex-direction: column; gap: 10px; }
  .deltaRow { display: flex; align-items: center; gap: 10px; }
  .deltaDot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
  .deltaLabel { width: 64px; flex-shrink: 0; font-size: 13px; color: #333; }
  .deltaBarBg { flex: 1; height: 6px; border-radius: 999px; background: #eee; position: relative; overflow: visible; }
  .deltaBarFg { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #a78bfa, #7c5cff); }
  .deltaValue { width: 96px; flex-shrink: 0; text-align: right; font-size: 12px; color: #888; }
  .deltaValue.up { color: #16a34a; }
  .deltaValue.down { color: #dc2626; }

  .headline { font-size: 15px; font-weight: 700; color: #4c3a99; margin-bottom: 4px; }
  .narrative { font-size: 13px; color: #555; line-height: 1.7; }

  .concept {
    font-size: 12px; color: #7c5cff; background: #f0ecff; border-radius: 12px;
    padding: 12px 14px; line-height: 1.7; margin-top: 4px;
  }

  .empty { text-align: center; color: #888; font-size: 13px; padding: 40px 16px; }
  .loading { text-align: center; color: #aaa; font-size: 13px; padding: 40px 16px; }

  /* ロゴ（勾玉）。形の由来と作図は public/icons/mark.svg のコメントを参照。
     読み込みを1往復増やさないため、pathはHTMLに直接埋め込んでいる。 */
  .brand { display: inline-flex; align-items: center; gap: 5px; }
  .brand .mk { width: 1.25em; height: 1.25em; flex: none; }
</style>
</head>
<body>
<header>
  <div class="row">
    <a id="backBtn" href="#">← チャットに戻る</a>
    <div>
      <div class="brand"><svg class="mk" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M59.7 13.8 C61.1 14.9 65.5 17.8 68.1 20.4 C70.6 22.9 73.1 26.0 74.9 29.0 C76.6 32.1 77.8 35.3 78.5 38.7 C79.1 42.1 79.3 45.9 78.7 49.4 C78.0 52.9 76.7 56.7 74.8 59.7 C72.9 62.7 70.3 65.4 67.4 67.3 C64.5 69.2 60.8 70.7 57.5 71.1 C54.1 71.5 50.2 71.2 47.1 69.9 C44.0 68.6 40.1 64.6 38.7 63.5 A5.0 5.0 0 0 1 45.1 55.8 C45.6 56.1 46.9 57.1 48.0 57.4 C49.0 57.7 50.2 57.8 51.2 57.6 C52.3 57.4 53.5 56.9 54.4 56.3 C55.3 55.7 56.0 54.8 56.5 53.8 C57.0 52.9 57.3 51.7 57.3 50.6 C57.3 49.6 57.0 48.3 56.5 47.4 C56.0 46.5 55.0 45.5 54.1 45.2 C53.2 44.9 51.7 45.6 51.2 45.7 A16.5 16.5 0 0 1 59.7 13.8 Z M47.5 29.7a7.9 7.9 0 1 0 15.8 0a7.9 7.9 0 1 0 -15.8 0Z"/></svg><span>わけたま</span></div>
      <h1 id="pageTitle">成長の記録</h1>
    </div>
  </div>
</header>

<main>
  <div id="loading" class="loading">読み込み中…</div>

  <div id="content" hidden>
    <div class="card">
      <div class="headline" id="headline"></div>
      <div class="narrative" id="narrative"></div>
    </div>

    <div class="card">
      <h2>性格パラメータの推移</h2>
      <div class="sub" id="chartSub">やり取りを重ねるたびに、少しずつ動いてきた記録です</div>
      <div id="chartWrap">
        <canvas id="chart" width="600" height="320"></canvas>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card">
      <h2>誕生時からの変化</h2>
      <div class="sub">全パラメータ50からスタートし、今はここまで動きました</div>
      <div class="deltaList" id="deltaList"></div>
    </div>

    <div class="card">
      <div class="concept" id="conceptNote"></div>
    </div>
  </div>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const cid = params.get("cid");
  document.getElementById("backBtn").href = `/chat?cid=${encodeURIComponent(cid || "")}`;

  const TRAITS = [
    { key: "warmth", label: "温かさ", color: "#f472b6" },
    { key: "curiosity", label: "好奇心", color: "#38bdf8" },
    { key: "cheerfulness", label: "陽気さ", color: "#fbbf24" },
    { key: "caution", label: "慎重さ", color: "#94a3b8" },
    { key: "independence", label: "自立心", color: "#34d399" },
    { key: "humor", label: "ユーモア", color: "#a78bfa" },
  ];

  function el(id) { return document.getElementById(id); }

  async function loadHistory() {
    if (!cid) return null;
    const res = await fetch(`/api/character/history?cid=${encodeURIComponent(cid)}`);
    if (!res.ok) return null;
    return res.json();
  }

  function drawChart(canvas, history) {
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.parentElement.clientWidth;
    const cssHeight = 320;
    canvas.style.height = cssHeight + "px";
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const padL = 30, padR = 12, padT = 12, padB = 24;
    const w = cssWidth - padL - padR;
    const h = cssHeight - padT - padB;

    // グリッド線（0/25/50/75/100）
    ctx.strokeStyle = "#eee";
    ctx.fillStyle = "#aaa";
    ctx.font = "10px sans-serif";
    ctx.lineWidth = 1;
    [0, 25, 50, 75, 100].forEach((v) => {
      const y = padT + h - (v / 100) * h;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + w, y);
      ctx.stroke();
      ctx.fillText(String(v), 2, y + 3);
    });

    const n = history.length;
    const xAt = (i) => padL + (n <= 1 ? w / 2 : (w * i) / (n - 1));
    const yAt = (v) => padT + h - (Math.max(0, Math.min(100, v)) / 100) * h;

    TRAITS.forEach((trait) => {
      ctx.strokeStyle = trait.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      history.forEach((entry, i) => {
        const x = xAt(i);
        const y = yAt(entry.personality[trait.key]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // 最後の点を強調
      const lastX = xAt(n - 1);
      const lastY = yAt(history[n - 1].personality[trait.key]);
      ctx.fillStyle = trait.color;
      ctx.beginPath();
      ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2);
      ctx.fill();
    });

    // x軸ラベル（最初と最後のやり取り回数）
    ctx.fillStyle = "#999";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`${history[0].interactionCount}回目`, padL, cssHeight - 6);
    ctx.textAlign = "right";
    ctx.fillText(`${history[n - 1].interactionCount}回目`, padL + w, cssHeight - 6);
    ctx.textAlign = "left";
  }

  function renderLegend(container) {
    container.innerHTML = "";
    for (const trait of TRAITS) {
      const item = document.createElement("div");
      item.className = "legendItem";
      item.innerHTML = `<span class="dot" style="background:${trait.color}"></span>${trait.label}`;
      container.appendChild(item);
    }
  }

  function renderDeltas(container, first, last) {
    container.innerHTML = "";
    for (const trait of TRAITS) {
      const before = Math.round(first.personality[trait.key]);
      const after = Math.round(last.personality[trait.key]);
      const delta = after - before;
      const row = document.createElement("div");
      row.className = "deltaRow";

      const barWidth = Math.min(50, Math.abs(delta)) / 50 * 50; // 最大±50を100%幅の半分として表示
      const fromCenter = delta >= 0;
      const barStyle = fromCenter
        ? `left:50%; width:${barWidth}%;`
        : `right:50%; width:${barWidth}%;`;

      const sign = delta > 0 ? "+" : "";
      const deltaClass = delta > 0 ? "up" : delta < 0 ? "down" : "";

      row.innerHTML = `
        <span class="deltaDot" style="background:${trait.color}"></span>
        <span class="deltaLabel">${trait.label}</span>
        <div class="deltaBarBg"><div class="deltaBarFg" style="${barStyle}"></div></div>
        <span class="deltaValue ${deltaClass}">${before} → ${after}（${sign}${delta}）</span>
      `;
      container.appendChild(row);
    }
  }

  function buildNarrative(name, first, last, interactionCount) {
    const labelOf = (key) => TRAITS.find((t) => t.key === key)?.label ?? key;
    const deltas = TRAITS.map((t) => ({
      key: t.key,
      delta: last.personality[t.key] - first.personality[t.key],
    }));
    const biggest = deltas.reduce((a, b) => (Math.abs(b.delta) > Math.abs(a.delta) ? b : a));

    if (interactionCount < 3) {
      return {
        headline: `${name}は、まだ生まれたばかり`,
        narrative:
          "会話を重ねるたびに、ここに性格の変化が記録されていきます。もう少し話しかけてみてください。",
      };
    }

    if (Math.abs(biggest.delta) < 3) {
      return {
        headline: `${name}の性格は、まだ大きくは変わっていません`,
        narrative:
          "全体的にバランスの取れた性格のまま育っています。話しかけ方によって、これからどんな個性が伸びていくか楽しみです。",
      };
    }

    const direction = biggest.delta > 0 ? "高く" : "低く";
    return {
      headline: `いちばん育った個性は「${labelOf(biggest.key)}」`,
      narrative: `誕生時から${direction}変化し、${Math.abs(Math.round(biggest.delta))}ポイント動きました。これは、あなたが${name}とどう接してきたかがそのまま反映された結果です。${name}の性格は、あなた自身との会話でしか生まれない、世界に一つだけのものです。`,
    };
  }

  (async () => {
    const data = await loadHistory();
    el("loading").hidden = true;

    if (!data || !data.history || data.history.length === 0) {
      el("loading").hidden = true;
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "記録が見つかりませんでした。";
      document.querySelector("main").appendChild(empty);
      return;
    }

    document.title = `わけたま｜${data.name}の成長記録`;
    el("pageTitle").textContent = `${data.name}の成長記録`;

    const history = data.history;
    const first = history[0];
    const last = history[history.length - 1];

    const { headline, narrative } = buildNarrative(data.name, first, last, data.interactionCount);
    el("headline").textContent = headline;
    el("narrative").textContent = narrative;

    drawChart(el("chart"), history);
    renderLegend(el("legend"));
    renderDeltas(el("deltaList"), first, last);

    el("conceptNote").textContent =
      `この記録は、${data.name}の「魂」にあたる部分です。今は画面の中の姿ですが、` +
      `将来メタバースやロボットなど別の身体に宿るときも、この性格と記憶は引き継がれていく予定です。`;

    el("content").hidden = false;

    window.addEventListener("resize", () => drawChart(el("chart"), history));
  })();
</script>

<script>
  // Service Workerの登録。失敗してもアプリ本体の動作には一切影響させない
  // （非対応ブラウザ・プライベートモード・http環境などでは単に登録されないだけ）。
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
