<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>わけたま｜ページが見つかりません</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#7c5cff" />
<link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f5f3ff; color: #2c2440;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; border: 1px solid #eee; border-radius: 20px;
    padding: 28px 22px; max-width: 420px; width: 100%; text-align: center;
  }
  .tama { font-size: 52px; line-height: 1; }
  h1 { font-size: 18px; margin: 14px 0 6px; }
  p { font-size: 14px; line-height: 1.9; color: #6b6386; margin: 0 0 8px; }
  .links { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  a.btn {
    display: block; padding: 13px 16px; border-radius: 12px; text-decoration: none;
    font-size: 14px; font-weight: 700;
  }
  a.primary { background: #7c5cff; color: #fff; }
  a.ghost { background: #f2effd; color: #4c3a99; }
  .note { font-size: 12px; color: #9a90c0; margin-top: 18px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="card">
    <div class="tama" aria-hidden="true">🫧</div>
    <h1>このページは見つかりませんでした</h1>
    <p>URLが変わったか、入力に誤りがあるかもしれません。</p>
    <div class="links">
      <a class="btn primary" href="/home">分身の一覧をひらく</a>
      <a class="btn ghost" href="/lp">わけたまについて</a>
    </div>
    <p class="note">
      分身が見つからない場合は、以前と同じブラウザで開いているかご確認ください。<br />
      端末を変えた・データを消したときは <a href="/recover">引き継ぎ・復旧</a> からご相談いただけます。
    </p>
  </div>
</body>
</html>
