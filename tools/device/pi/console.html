<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>わけたま検証機 — 操作盤</title>
<!--
  母艦（wt_hub.py serve）が出す操作盤。
  検証の最中に手が塞がるので、**押すところは大きく、判定は自動で**。
  記録は母艦側のCSVに落ちているので、この画面は消えても困らない。
-->
<style>
  :root { --ink:#1c1630; --muted:#6f668f; --line:#e9e5f7; --accent:#7c5cff; --ok:#2f9e6b; --ng:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 48px; background:#faf9ff; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; line-height:1.7; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12.5px; margin:0 0 18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .slots { display:flex; gap:12px; flex-wrap:wrap; }
  .slot { flex:1; min-width:150px; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .slot b { display:block; font-size:15px; }
  .slot span { font-size:12px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#ccc; }
  .dot.on { background:var(--ok); }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
  button { border:none; background:var(--accent); color:#fff; font-weight:700; font-size:15px;
    padding:14px 20px; border-radius:999px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#fff; color:var(--muted); border:1px solid var(--line); font-weight:400; }
  button.stop { background:var(--ng); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:400; }
  .log { max-height:300px; overflow:auto; }
  .check { display:flex; gap:8px; align-items:center; font-size:13px; padding:4px 0; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; background:var(--ng); }
  .badge.ok { background:var(--ok); }
  .verdict { font-size:16px; font-weight:700; margin-top:10px; }
</style>
</head>
<body>
  <h1>わけたま検証機 — 操作盤</h1>
  <p class="sub">同じイベントを2台へ<strong>同時に</strong>送ります。記録は母艦のCSV（<span id="run">—</span>）に残ります。</p>

  <div class="card">
    <div class="slots" id="slots"></div>
  </div>

  <div class="card">
    <div class="btns">
      <button data-e="greet">話しかける</button>
      <button data-e="approach" data-arg="2.0">近づく (2.0m)</button>
      <button data-e="approach" data-arg="0.8">もっと近づく (0.8m)</button>
      <button data-e="change">予定を変える</button>
      <button data-e="silence" data-arg="30">黙る (30秒)</button>
      <button data-e="idle" class="ghost">待機を1周</button>
      <button id="push" class="ghost">人格を入れ直す</button>
      <button id="stop" class="stop">止める</button>
    </div>
  </div>

  <div class="card">
    <b style="font-size:14px">判定</b>
    <div id="checks"></div>
    <div class="verdict" id="verdict">—</div>
  </div>

  <div class="card">
    <b style="font-size:14px">動いた記録</b>
    <div class="log">
      <table>
        <thead><tr><th>時刻</th><th>機体</th><th>種類</th><th>中身</th><th>間(ms)</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

<script>
  const el = (id) => document.getElementById(id);

  async function post(path, body) {
    await fetch(path, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(body || {}) });
  }

  document.querySelectorAll("button[data-e]").forEach((b) => {
    b.addEventListener("click", () => post("/event", { e: b.dataset.e, arg: b.dataset.arg ? Number(b.dataset.arg) : null }));
  });
  el("push").addEventListener("click", () => post("/push"));
  el("stop").addEventListener("click", () => post("/stop"));

  async function refresh() {
    try {
      const s = await (await fetch("/state")).json();
      el("run").textContent = s.run || "—";
      el("slots").innerHTML = "";
      for (const slot of ["a", "b"]) {
        const div = document.createElement("div");
        div.className = "slot";
        const alive = s.nodes[slot];
        div.innerHTML = `<b><span class="dot ${alive ? "on" : ""}"></span>${slot.toUpperCase()}</b>
          <span>${s.personas[slot] || "（人格なし）"}</span>`;
        el("slots").appendChild(div);
      }
      const tb = el("rows");
      tb.innerHTML = "";
      for (const r of s.rows.slice().reverse()) {
        const tr = document.createElement("tr");
        const what = [r[3], r[4], r[5], r[6]].filter(Boolean).join(" ");
        tr.innerHTML = `<td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${what}</td><td>${r[7] || ""}</td>`;
        tb.appendChild(tr);
      }
    } catch (e) { /* 母艦が落ちているだけ。画面は残す */ }
  }

  async function refreshCompare() {
    try {
      const c = await (await fetch("/compare")).json();
      const box = el("checks");
      box.innerHTML = "";
      if (c.error) { el("verdict").textContent = c.error; return; }
      for (const [name, ok, detail] of c.checks) {
        const d = document.createElement("div");
        d.className = "check";
        d.innerHTML = `<span class="badge ${ok ? "ok" : ""}">${ok ? "合格" : "不合格"}</span>
          <span>${name}${detail ? "（" + detail + "）" : ""}</span>`;
        box.appendChild(d);
      }
      el("verdict").textContent = c.pass ? "合格 — 人格の差が振る舞いの差になっています"
        : "不合格 — 育ちが浅いか、性格が近すぎます";
      el("verdict").style.color = c.pass ? "var(--ok)" : "var(--ng)";
    } catch (e) { /* 同上 */ }
  }

  refresh(); refreshCompare();
  setInterval(refresh, 1200);
  setInterval(refreshCompare, 8000);
</script>
</body>
</html>
