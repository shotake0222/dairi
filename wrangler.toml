name = "sodatsukake"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# --- 独自ドメイン ---
# 本番の公開URLは https://app.waketama.com
#
# custom_domain = true にしてあるので、デプロイ時にCloudflareがDNSレコードとTLS証明書を
# 自動で用意する。**事前に app のDNSレコードを手で作る必要はない**
# （むしろ手で作っておくと「既にレコードがある」と衝突してデプロイが止まることがある）。
#
# 紹介用のページ（/lp・/biz）は apex（waketama.com）で見せ、サービス本体は app.waketama.com に置く。
# 同じWorkerが両方のホストを受け、src/index.ts の hostRedirect() が振り分ける。
#
# **なぜ本体を1つのホストに寄せるのか。**
# 持ち主トークンはブラウザのlocalStorageにあり、localStorageはオリジンごとに別物になる。
# 同じアプリを2つのホストで開けるようにすると、片方で育てた分身がもう片方からは
# 「持ち主ではない」状態に見える。ユーザーから見れば分身を失ったのと同じなので、
# アプリ本体のパスに apex で来た人は app へ送り返す。
#
# apex を custom_domain にすると、CloudflareがDNSと証明書を用意する。
# 既に waketama.com に A/CNAME レコードが手で作られていると衝突してデプロイが止まるので、
# その場合は先にそのレコードを削除すること。
routes = [
  { pattern = "app.waketama.com", custom_domain = true },
  { pattern = "waketama.com", custom_domain = true }
]

# --- 環境の識別子 ---
# コード側で本番か検証環境かを見分けるために使う（検証環境には検索避けと合言葉を付ける）。
[vars]
ENVIRONMENT = "production"
# 2つのホストの役割。どちらか未設定なら振り分けは一切行わない
# （検証環境・ローカルで意図しないリダイレクトが起きないようにするため）。
SITE_HOST = "waketama.com"
APP_HOST = "app.waketama.com"

# --- 観測性（Workers Logs） ---
# 本番で何が起きたかを後から追えるようにする。これが無効だとダッシュボードにログが残らず、
# `wrangler tail` を繋いでいる最中の事象しか見られない（実機で起きた不具合の再現待ちになる）。
# head_sampling_rate = 1 は全リクエストを記録する設定。利用者が増えてコストが気になり始めたら下げる。
[observability]
enabled = true
head_sampling_rate = 1

# --- 静的ファイル（AR召喚ページ・チャットページ） ---
[assets]
directory = "./public"
binding = "ASSETS"
# not_found_handling は既定（none）のままにすること。
# "404-page" にすると、アセットに無いパスをアセット層が404で返してしまい、
# **Workerまで届かなくなる**（/api/* が全滅する）。案内のある404ページは
# src/index.ts の serveAsset() が public/404.html を読んで返している。
# HTMLページだけはWorkerを先に通す。
# 既定では静的ファイルはWorkerに届く前にアセット層が直接返してしまい、
# src/index.ts の HTMLRewriter（OGPのURL絶対化）が動かないため。
# 画像や3Dモデルまで対象にするとリクエストごとにWorker呼び出しが増えるので、ページのパスだけに限定する。
run_worker_first = ["/", "/home", "/chat", "/call", "/talk", "/eyes", "/summon", "/friends", "/history", "/profile", "/market", "/admin", "/add", "/lp", "/biz", "/privacy", "/terms", "/recover", "/offline", "/sw.js", "/robots.txt", "/sitemap.xml"]

# --- Workers AI（序盤はSLMで運用） ---
[ai]
binding = "AI"

# --- D1（NFCタグ⇔キャラクターの紐付けなど） ---
# database_id は `wrangler d1 create nfc-companion-db` 実行後に発行されるIDに書き換えてください
[[d1_databases]]
binding = "DB"
database_name = "nfc-companion-db"
database_id = "3bdc078a-650a-4755-a37f-174957038ab8"

# --- Vectorize（長期記憶：会話の埋め込みベクトルを保存し、類似検索でRAG的に思い出す） ---
# 事前に以下を一度だけ実行してインデックスを作成してください（bge-m3は1024次元）:
#   npx wrangler vectorize create nfc-companion-memory --dimensions=1024 --metric=cosine
#   npx wrangler vectorize create-metadata-index nfc-companion-memory --property-name=characterId --type=string
[[vectorize]]
binding = "MEMORY_INDEX"
index_name = "nfc-companion-memory"

# --- Durable Objects（キャラクター1体＝1インスタンスで性格・記憶を保持） ---
[[durable_objects.bindings]]
name = "CHARACTER"
class_name = "CharacterState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CharacterState"]

# --- 留守番エージェント（自動お散歩）: 1日2回、オプトイン済みキャラクターの「お散歩」を自動実行する ---
# 頻度を上げすぎるとAI呼び出しコストが増えるため、まずは控えめな回数から開始し、様子を見て調整してください。
[triggers]
crons = ["0 3,12 * * *"]

# ============================================================
# ステージング環境
# ============================================================
# 本番のD1に混ざると、テストで作った分身が「お散歩」の相手候補として実ユーザーに出てしまう。
# 検証はこちらに投げること。
#
# 初回だけ、専用のD1とVectorizeインデックスを作る必要がある:
#   npx wrangler d1 create waketama-staging-db
#     → 出力された database_id を下の REPLACE_WITH_STAGING_D1_ID に貼る
#   npx wrangler d1 migrations apply waketama-staging-db --remote --env staging
#   npx wrangler vectorize create waketama-staging-memory --dimensions=1024 --metric=cosine
#   npx wrangler vectorize create-metadata-index waketama-staging-memory --property-name=characterId --type=string
#
# デプロイ: npm run deploy:staging
#
# 自動お散歩(cron)は意図的に設定していない。検証環境で勝手にAIコストが発生しないようにするため、
# ステージングでの動作確認は手動の「お散歩に出す」ボタンから行う。
[env.staging]
name = "waketama-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
# not_found_handling は既定のまま（理由は本番側のコメント）
run_worker_first = ["/", "/home", "/chat", "/call", "/talk", "/eyes", "/summon", "/friends", "/history", "/profile", "/market", "/admin", "/add", "/lp", "/biz", "/privacy", "/terms", "/recover", "/offline", "/sw.js", "/robots.txt", "/sitemap.xml"]

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "waketama-staging-db"
database_id = "REPLACE_WITH_STAGING_D1_ID"

[[env.staging.vectorize]]
binding = "MEMORY_INDEX"
index_name = "waketama-staging-memory"

[[env.staging.durable_objects.bindings]]
name = "CHARACTER"
class_name = "CharacterState"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["CharacterState"]

# 検証環境のURL: https://staging.waketama.com
# 本番と同じくDNSレコードと証明書はCloudflareが自動で用意する（手動作成は不要）。
#
# 検証環境は誰でも開ける状態になるうえ、本物のWorkers AIを呼ぶため、
# 合言葉をかけておくことを推奨:
#   npx wrangler secret put STAGING_PASSCODE --env staging
# 設定すると `?key=合言葉` で入る形になり、未設定なら素通し。
# 検索避け（noindex）は合言葉の有無に関わらず常に有効。
[[env.staging.routes]]
pattern = "staging.waketama.com"
custom_domain = true
